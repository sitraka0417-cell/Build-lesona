plugins {
	id 'com.android.application'
}

// Versions : numéro de build GitHub -> versionCode ; tag vX.Y.Z -> versionName
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
def appVersionName = System.getenv("APP_VERSION") ?: "1.0.${runNumber}"

android {
	compileSdkVersion 28

	useLibrary 'org.apache.http.legacy'

	defaultConfig {
		applicationId "com.lesona.lehibe"
		minSdkVersion 21
		targetSdkVersion 28
		versionCode runNumber
		versionName appVersionName
	}

	signingConfigs {
		debug {
			storeFile file('debug.keystore')
			storePassword 'android'
			keyAlias 'androiddebugkey'
			keyPassword 'android'
		}
		release {
			if (System.getenv("RELEASE_KEYSTORE_FILE")) {
				// Clé personnelle fournie via les secrets GitHub
				storeFile file(System.getenv("RELEASE_KEYSTORE_FILE"))
				storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
				keyAlias System.getenv("RELEASE_KEY_ALIAS")
				keyPassword System.getenv("RELEASE_KEY_PASSWORD")
			} else {
				// Sans secrets : on réutilise la clé du projet (signature stable)
				storeFile file('debug.keystore')
				storePassword 'android'
				keyAlias 'androiddebugkey'
				keyPassword 'android'
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled true
			shrinkResources true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			signingConfig signingConfigs.release
		}
	}

	// Nom de fichier clair : LesonaLehibe-v1.0.12-release.apk
	applicationVariants.all { variant ->
		variant.outputs.all {
			outputFileName = "LesonaLehibe-v${variant.versionName}-${variant.buildType.name}.apk"
		}
	}

	lint {
		abortOnError false
		checkReleaseBuilds false
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
}
