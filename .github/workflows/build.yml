name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # nécessaire seulement pour publier une Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: APK debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android (licences + plateforme 28)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-28" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            {
              echo '### Erreur Gradle (debug) - fin du journal'
              echo '```'
              tail -n 70 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $CODE
      - uses: actions/upload-artifact@v4
        with:
          name: Lesona-Lehibe-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: APK release (signé, réduit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android (licences + plateforme 28)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-28" "build-tools;30.0.3"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.4

      - name: Version depuis le tag (v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Clé de signature personnelle (facultatif)
        env:
          KS_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --console=plain > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            {
              echo '### Erreur Gradle (release) - fin du journal'
              echo '```'
              tail -n 70 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $CODE

      - uses: actions/upload-artifact@v4
        with:
          name: Lesona-Lehibe-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
